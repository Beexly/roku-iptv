name: refresh

# Rebuilds the playlist in cloud CI so the Roku's playlist never depends on
# the user's laptop being awake.
#
# The build output is NEVER committed back to the branch. It is uploaded as a
# Pages artifact and deployed from the artifact (actions/deploy-pages), so
# there is no commit/push race with anything else touching the repo and no
# merge conflicts in generated files.
#
# Probe results are cached with actions/cache so the next run only re-probes
# what changed. The cache is a CI artifact, not a repo file.

on:
  schedule:
    # 04:17 UTC daily. Off the hour on purpose - every workflow in the world
    # fires at :00 and the shared runner pool is saturated then.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the probe cache and re-probe every channel"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      IPTV_WORKERS: "16"
      IPTV_PROBE_TIMEOUT: "12"
      IPTV_PRECHECK_TIMEOUT: "6"
      VOD_MAX_ITEMS: "1200"
    outputs:
      live_count: ${{ steps.validate.outputs.live_count }}
      vod_count: ${{ steps.validate.outputs.vod_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python dependencies
        run: |
          set -euo pipefail
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          python -c "import qrcode; print('qrcode import OK', qrcode.__file__)"

      - name: Restore probe cache
        uses: actions/cache@v4
        with:
          path: cache.json
          key: probe-${{ github.run_id }}
          restore-keys: probe-

      - name: Build live playlist
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            rm -f cache.json
          fi
          python pipeline.py

      - name: Build EPG guide
        run: |
          set -euo pipefail
          curl -sSL --max-time 600 -o epg_raw.xml https://epg.pw/xmltv/epg_US.xml
          ls -la epg_raw.xml
          python build_epg.py epg_raw.xml
          rm -f epg_raw.xml

      - name: Build VOD playlist
        run: |
          set -euo pipefail
          python build_vod.py

      - name: Validate build output
        id: validate
        run: |
          set -euo pipefail
          n=$(grep -c '^#EXTINF' tv.m3u)
          v=$(grep -c '^#EXTINF' vod.m3u)
          echo "live=$n vod=$v"
          [ "$n" -ge 400 ] || { echo "ABORT: only $n live channels"; exit 1; }
          [ "$v" -ge 50 ]  || { echo "ABORT: only $v VOD entries"; exit 1; }
          head -1 tv.m3u | grep -q '^#EXTM3U' || { echo "bad tv header"; exit 1; }
          head -1 vod.m3u | grep -q '^#EXTM3U' || { echo "bad vod header"; exit 1; }
          # every EXTINF must be followed by a URL line
          python - <<'PY'
          import sys
          for name in ("tv.m3u", "vod.m3u"):
              rows = [l.strip() for l in open(name, encoding="utf-8", errors="replace") if l.strip()]
              bad = 0
              for i, line in enumerate(rows):
                  if line.startswith("#EXTINF"):
                      if i + 1 >= len(rows) or rows[i + 1].startswith("#"):
                          bad += 1
              print(name, "malformed rows:", bad)
              if bad:
                  sys.exit(1)
          PY
          echo "live_count=$n" >> "$GITHUB_OUTPUT"
          echo "vod_count=$v" >> "$GITHUB_OUTPUT"

      - name: Stage dist/
        run: |
          set -euo pipefail
          mkdir -p dist
          cp tv.m3u vod.m3u epg.xml dist/
          # the viewer setup card: QR code + copy-able URLs
          python build_setup.py
          ls -la dist/

      - name: Verify the setup card QR is scannable
        run: |
          set -euo pipefail
          if pip install --quiet opencv-python-headless numpy; then
            python verify_qr.py dist/setup.html
          else
            echo "WARNING: opencv unavailable, skipping the QR decode check"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Save probe cache for the next run
        uses: actions/cache/save@v4
        if: always()
        with:
          path: cache.json
          key: probe-${{ github.run_id }}

  deploy:
    name: deploy
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: verify
    needs: [probe, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the published URLs
        run: |
          set -euo pipefail
          python verify.py --base "${{ needs.deploy.outputs.page_url }}"

      - name: Write summary
        run: |
          {
            echo "## Roku IPTV refresh"
            echo ""
            echo "| Playlist | URL | Count |"
            echo "|---|---|---|"
            echo "| Live TV | ${{ needs.deploy.outputs.page_url }}/tv.m3u | ${{ needs.probe.outputs.live_count }} |"
            echo "| Movies + series | ${{ needs.deploy.outputs.page_url }}/vod.m3u | ${{ needs.probe.outputs.vod_count }} |"
            echo "| EPG guide | ${{ needs.deploy.outputs.page_url }}/epg.xml | - |"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: summary
    needs: [probe, deploy, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Job summary
        run: |
          echo "live=${{ needs.probe.outputs.live_count }} vod=${{ needs.probe.outputs.vod_count }}" >> "$GITHUB_STEP_SUMMARY"
